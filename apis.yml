name: Alice
description: >-
  Alice (formerly ActiveFence) is an enterprise AI security, safety, and trust
  platform for the GenAI era. Its WonderSuite platform stress-tests, guards, and
  monitors AI models, applications, and agents against jailbreaks, prompt
  injection, unsafe outputs, and policy violations. The Alice API provides content
  analysis (text, image, video, and audio moderation), real-time GenAI message
  evaluation (WonderFence), and adversarial red-team assessments (WonderBuild),
  authenticated with an af-api-key header and delivering asynchronous results via
  callback webhooks. Alice safeguards more than 3 billion users across 120+
  languages and is SOC 2 and ISO 27001 certified.
